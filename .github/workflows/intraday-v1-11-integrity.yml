name: Intraday V1.11 integrity patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[intraday-v1.11-integrity]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact horizon and candidate selection
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/api/intraday-scanner/route.js')
          s = p.read_text()
          s = s.replace('const top = candidates.slice(0, MAX_SIGNALS);', 'const cutoff = Date.now() - SIGNAL_COOLDOWN_MINUTES * 60000;\n      const { data: recentOpen } = await createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY).from("intraday_signal_outcomes").select("trading_symbol,signal_at").eq("user_id", user.id).eq("status", "OPEN").gte("signal_at", new Date(cutoff).toISOString()).limit(100);\n      const recentSymbols = new Set((recentOpen || []).map(r => r.trading_symbol));\n      const top = candidates.filter(x => !recentSymbols.has(x.trading_symbol)).slice(0, MAX_SIGNALS);')
          s = s.replace('const cutoff = Date.now() - SIGNAL_COOLDOWN_MINUTES * 60000;\n      const { data: recentOpen } = await createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY).from("intraday_signal_outcomes").select("trading_symbol,signal_at").eq("user_id", user.id).eq("status", "OPEN").gte("signal_at", new Date(cutoff).toISOString()).limit(100);\n      const recentSymbols = new Set((recentOpen || []).map(r => r.trading_symbol));\n      const filteredTop = top.filter(x => !recentSymbols.has(x.trading_symbol));', '')
          s = s.replace('if (filteredTop.length) { const rows = filteredTop.map(x => ({ ...x, scan_at: scannedAt }));', 'if (top.length) { const rows = top.map(x => ({ ...x, scan_at: scannedAt }));')
          s = s.replace('signal_count: filteredTop.length, tracked_signal_count: tracked', 'signal_count: top.length, tracked_signal_count: tracked')
          s = s.replace('signals: filteredTop, scanned_at:', 'signals: top, scanned_at:')
          s = s.replace('data_status: "LIVE" };', 'data_status: "LIVE", expected_horizon_minutes: 30 };')
          s = s.replace('risk_reward, signal_at: x.scan_at, outcome: "OPEN"', 'risk_reward, signal_at: x.scan_at, expected_horizon_minutes: 30, outcome: "OPEN"')
          p.write_text(s)

          p = Path('app/api/intraday-signal-outcomes/evaluate/route.js')
          s = p.read_text()
          old = 'const signalMs=new Date(signal.signal_at).getTime(),usable=candles.filter(c=>{const t=new Date(c?.[0]).getTime();return Number.isFinite(t)&&t>=signalMs;}),timeline=timelineMetrics(signal,candles,now);let mae=0,mfe=0;const entry=Number(signal.entry_price);for(const candle of usable){'
          new = 'const signalMs=new Date(signal.signal_at).getTime(),horizonMs=signalMs+MAX_EVALUATION_MINUTES*60000,usable=candles.filter(c=>{const t=new Date(c?.[0]).getTime();return Number.isFinite(t)&&t>=signalMs&&t<=Math.min(now.getTime(),horizonMs);}),timeline=timelineMetrics(signal,candles,now);let mae=0,mfe=0;const entry=Number(signal.entry_price);for(const candle of usable){'
          if old not in s: raise SystemExit('evaluator candle window not found')
          s = s.replace(old, new)
          s = s.replace('function crossingOutcome(signal,candle){const high=n(candle?.[2]),low=n(candle?.[3]);if(high==null||low==null)return null;if(signal.direction==="LONG"){if(low<=Number(signal.stop_loss))return{outcome:"STOP_LOSS",price:Number(signal.stop_loss)};if(high>=Number(signal.target_2))return{outcome:"TARGET_2",price:Number(signal.target_2)};if(high>=Number(signal.target_1))return{outcome:"TARGET_1",price:Number(signal.target_1)};}else{if(high>=Number(signal.stop_loss))return{outcome:"STOP_LOSS",price:Number(signal.stop_loss)};if(low<=Number(signal.target_2))return{outcome:"TARGET_2",price:Number(signal.target_2)};if(low<=Number(signal.target_1))return{outcome:"TARGET_1",price:Number(signal.target_1)};}return null;}', 'function crossingOutcome(signal,candle){const high=n(candle?.[2]),low=n(candle?.[3]);if(high==null||low==null)return null;if(signal.direction==="LONG"){const stop=Number(signal.stop_loss),t1=Number(signal.target_1),t2=Number(signal.target_2);const stopHit=low<=stop,target2Hit=high>=t2,target1Hit=high>=t1;if(stopHit&&target2Hit)return{outcome:"STOP_LOSS",price:stop,ambiguous:true};if(stopHit)return{outcome:"STOP_LOSS",price:stop};if(target2Hit)return{outcome:"TARGET_2",price:t2};if(target1Hit)return{outcome:"TARGET_1",price:t1};}else{const stop=Number(signal.stop_loss),t1=Number(signal.target_1),t2=Number(signal.target_2);const stopHit=high>=stop,target2Hit=low<=t2,target1Hit=low<=t1;if(stopHit&&target2Hit)return{outcome:"STOP_LOSS",price:stop,ambiguous:true};if(stopHit)return{outcome:"STOP_LOSS",price:stop};if(target2Hit)return{outcome:"TARGET_2",price:t2};if(target1Hit)return{outcome:"TARGET_1",price:t1};}return null;}' )
          s = s.replace('return{status:"CLOSED",outcome:"EXPIRED",current_price:currentPrice,return_pct,realized_r:rMultiple(signal,currentPrice),mae_pct:mae,mfe_pct:mfe,duration_minutes,...timeline,closed_at:now,last_checked_at:now};', 'return{status:"CLOSED",outcome:"EXPIRED",current_price:currentPrice,return_pct,realized_r:rMultiple(signal,currentPrice),mae_pct:mae,mfe_pct:mfe,duration_minutes,...timeline,closed_at:now,last_checked_at:now};')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/intraday-scanner/route.js app/api/intraday-signal-outcomes/evaluate/route.js
          git commit -m "Enforce intraday 30m evaluation horizon and signal cooldown [intraday-v1.11-integrity]"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/intraday-v1-11-integrity.yml
          git commit -m "Remove temporary intraday integrity workflow"
          git push
