name: Fix intraday scanner warmup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: >-
      !contains(github.event.head_commit.message, '[intraday-warmup-patched]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch intraday warmup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/api/intraday-scanner/route.js')
          s = p.read_text()
          if 'intraday_engine_v1_9' not in s:
              raise SystemExit('Expected V1.9 source not found; refusing to patch.')
          s = s.replace('const ENGINE_VERSION = "intraday_engine_v1_9";', 'const ENGINE_VERSION = "intraday_engine_v1_10";', 1)
          pattern = r'async function intradayMetrics\(key, token, diagnostics\) \{.*?\nfunction rankCandidate'
          replacement = r'''async function intradayMetrics(key, token, diagnostics) {
            const r = await upstox(`/historical-candle/intraday/${encodeURIComponent(key)}/minutes/5`, token);
            if (!r.ok) {
              diagnostics.http_failures += 1;
              diagnostics.status_counts[String(r.status)] = (diagnostics.status_counts[String(r.status)] || 0) + 1;
              return null;
            }
            const candles = Array.isArray(r.body?.data?.candles) ? r.body.data.candles : [];
            const ordered = [...candles].reverse();
            const completed = ordered.length > 0 ? ordered.slice(0, -1) : [];
            const warmupRequired = 3;
            if (completed.length < warmupRequired) {
              diagnostics.insufficient_completed_candles += 1;
              return null;
            }
            const closes = completed.map(x => n(x[4])).filter(v => v != null);
            const highs = completed.map(x => n(x[2])).filter(v => v != null);
            const lows = completed.map(x => n(x[3])).filter(v => v != null);
            const vols = completed.map(x => n(x[5])).filter(v => v != null);
            if (closes.length < warmupRequired || highs.length < warmupRequired || lows.length < warmupRequired || vols.length < warmupRequired) {
              diagnostics.insufficient_completed_candles += 1;
              return null;
            }
            const last = completed.at(-1);
            const price = n(last?.[4]);
            const recentVol = vols.at(-1);
            const baselineVols = vols.slice(0, -1);
            const baseline = avg(baselineVols);
            const relativeVolume = baseline && recentVol ? recentVol / baseline : null;
            let pv = 0, vv = 0;
            for (const c of completed) {
              const h=n(c[2]), l=n(c[3]), v=n(c[5]);
              if(h!=null&&l!=null&&v!=null){pv += ((h+l)/2)*v; vv += v;}
            }
            const vwap = vv ? pv / vv : null;
            const priorHigh = Math.max(...highs.slice(0, -1));
            const priorLow = Math.min(...lows.slice(0, -1));
            const recentLow3 = Math.min(...lows.slice(-3));
            const recentHigh3 = Math.max(...highs.slice(-3));
            const momentum5 = closes.length > 1 && closes.at(-2) ? ((price - closes.at(-2)) / closes.at(-2)) * 100 : 0;
            const candleOpen = n(last?.[1]), candleClose = n(last?.[4]);
            const candleBodyPct = candleOpen && candleClose ? Math.abs((candleClose - candleOpen) / candleOpen) * 100 : 0;
            const candleDirection = candleClose > candleOpen ? "LONG" : candleClose < candleOpen ? "SHORT" : "FLAT";
            diagnostics.successful_candles += 1;
            return { price, relativeVolume, vwap, priorHigh, priorLow, recentLow3, recentHigh3, momentum5, candleBodyPct, candleDirection };
          }
          function rankCandidate'''
          ns, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate intradayMetrics block; refusing to patch.')
          p.write_text(ns)
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/intraday-scanner/route.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix intraday scanner early-session warmup [intraday-warmup-patched]'
          git push
