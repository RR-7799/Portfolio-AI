name: Intraday V1.11 hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[intraday-v1.11-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner and evaluator
        shell: python
        run: |
          from pathlib import Path

          scanner = Path('app/api/intraday-scanner/route.js')
          s = scanner.read_text()
          s = s.replace('const ENGINE_VERSION = "intraday_engine_v1_10";', 'const ENGINE_VERSION = "intraday_engine_v1_11";')
          s = s.replace('const MIN_SETUP_SCORE = 78;', 'const MIN_SETUP_SCORE = 84;\nconst MIN_COMPLETED_CANDLES = 12;\nconst VOLUME_BASELINE_CANDLES = 8;\nconst MAX_SIGNALS = 10;\nconst SIGNAL_COOLDOWN_MINUTES = 30;')
          s = s.replace('const warmupRequired = 3;', 'const warmupRequired = MIN_COMPLETED_CANDLES;')
          s = s.replace('const baselineVols = vols.slice(0, -1);', 'const baselineVols = vols.slice(Math.max(0, vols.length - VOLUME_BASELINE_CANDLES - 1), -1);')
          s = s.replace('const priorHigh = Math.max(...highs.slice(0, -1));', 'const priorHigh = Math.max(...highs.slice(Math.max(0, highs.length - 7), -1));')
          s = s.replace('const priorLow = Math.min(...lows.slice(0, -1));', 'const priorLow = Math.min(...lows.slice(Math.max(0, lows.length - 7), -1));')
          s = s.replace('const recentLow3 = Math.min(...lows.slice(-3));', 'const recentLow3 = Math.min(...lows.slice(-5));')
          s = s.replace('const recentHigh3 = Math.max(...highs.slice(-3));', 'const recentHigh3 = Math.max(...highs.slice(-5));')
          s = s.replace('const momentum5 = closes.length > 1 && closes.at(-2) ? ((price - closes.at(-2)) / closes.at(-2)) * 100 : 0;', 'const momentum5 = closes.length > 3 && closes.at(-4) ? ((price - closes.at(-4)) / closes.at(-4)) * 100 : 0;')
          old = 'const breakoutLong = entry > m.priorHigh && m.candleDirection === "LONG" && m.candleBodyPct >= 0.15 && rv >= 1.5; const breakoutShort = entry < m.priorLow && m.candleDirection === "SHORT" && m.candleBodyPct >= 0.15 && rv >= 1.5; const longMomentum = changePct > 0.6 && m.momentum5 > 0.3 && aboveVwap && m.candleDirection === "LONG" && rv >= 1.5; const shortMomentum = changePct < -0.6 && m.momentum5 < -0.3 && !aboveVwap && m.candleDirection === "SHORT" && rv >= 1.5;'
          new = 'const trendLong = closesTrend(m, "LONG"); const trendShort = closesTrend(m, "SHORT"); const breakoutLong = entry > m.priorHigh && m.candleDirection === "LONG" && m.candleBodyPct >= 0.25 && rv >= 1.8 && trendLong; const breakoutShort = entry < m.priorLow && m.candleDirection === "SHORT" && m.candleBodyPct >= 0.25 && rv >= 1.8 && trendShort; const longMomentum = changePct > 0.8 && m.momentum5 > 0.5 && aboveVwap && m.candleDirection === "LONG" && rv >= 1.8 && trendLong; const shortMomentum = changePct < -0.8 && m.momentum5 < -0.5 && !aboveVwap && m.candleDirection === "SHORT" && rv >= 1.8 && trendShort;'
          if old not in s: raise SystemExit('scanner setup block not found')
          s = s.replace(old, new)
          marker = 'function rankCandidate(meta, quote, m, funnel) {'
          helper = 'function closesTrend(m, direction) { const c = m.closes || []; if (c.length < 4) return false; const a = c.at(-1), b = c.at(-2), d = c.at(-3); return direction === "LONG" ? a > b && b > d : a < b && b < d; }\n'
          s = s.replace(marker, helper + marker)
          s = s.replace('return { price, relativeVolume, vwap, priorHigh, priorLow, recentLow3, recentHigh3, momentum5, candleBodyPct, candleDirection };', 'return { price, relativeVolume, vwap, priorHigh, priorLow, recentLow3, recentHigh3, momentum5, candleBodyPct, candleDirection, closes };')
          s = s.replace('if (vwapDistancePct > (breakout ? 1.0 : 0.8)) {', 'if (vwapDistancePct > (breakout ? 0.6 : 0.5)) {')
          s = s.replace('> 0.45) {', '> 0.25) {')
          s = s.replace('const top = candidates.slice(0, 15);', 'const top = candidates.slice(0, MAX_SIGNALS);')
          s = s.replace('const scannedAt = new Date().toISOString();', 'const scannedAt = new Date().toISOString();\n      const cutoff = Date.now() - SIGNAL_COOLDOWN_MINUTES * 60000;\n      const { data: recentOpen } = await createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY).from("intraday_signal_outcomes").select("trading_symbol,signal_at").eq("user_id", user.id).eq("status", "OPEN").gte("signal_at", new Date(cutoff).toISOString()).limit(100);\n      const recentSymbols = new Set((recentOpen || []).map(r => r.trading_symbol));\n      const filteredTop = top.filter(x => !recentSymbols.has(x.trading_symbol));')
          s = s.replace('if (top.length) { const rows = top.map(x => ({ ...x, scan_at: scannedAt }));', 'if (filteredTop.length) { const rows = filteredTop.map(x => ({ ...x, scan_at: scannedAt }));')
          s = s.replace('signal_count: top.length, tracked_signal_count: tracked', 'signal_count: filteredTop.length, tracked_signal_count: tracked')
          s = s.replace('signals: top, scanned_at:', 'signals: filteredTop, scanned_at:')
          s = s.replace('max_vwap_extension_pct: 1.0,', 'max_vwap_extension_pct: 0.6,')
          s = s.replace('min_setup_score: MIN_SETUP_SCORE,', 'min_setup_score: MIN_SETUP_SCORE, min_completed_candles: MIN_COMPLETED_CANDLES, volume_baseline_candles: VOLUME_BASELINE_CANDLES, signal_cooldown_minutes: SIGNAL_COOLDOWN_MINUTES,')
          scanner.write_text(s)

          evaluator = Path('app/api/intraday-signal-outcomes/evaluate/route.js')
          e = evaluator.read_text()
          e = e.replace('const ENGINE_VERSION = "intraday_outcome_engine_v1_3";', 'const ENGINE_VERSION = "intraday_outcome_engine_v1_4";')
          e = e.replace('const HORIZONS = [10,20,30,60];', 'const HORIZONS = [10,20,30];\nconst MAX_EVALUATION_MINUTES = 30;')
          e = e.replace('if(marketClosed(now)&&currentPrice!=null){', 'if(durationMinutes(signal, now) >= MAX_EVALUATION_MINUTES && currentPrice!=null){')
          e = e.replace('timeline_accuracy_definition:"Directional accuracy at the first available completed candle at or after each horizon; 100 means price moved favorably versus entry, otherwise 0."', 'timeline_accuracy_definition:"Directional accuracy at the first available completed candle at or after each horizon; 100 means price moved favorably versus entry, otherwise 0.",max_evaluation_minutes:MAX_EVALUATION_MINUTES')
          evaluator.write_text(e)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/intraday-scanner/route.js app/api/intraday-signal-outcomes/evaluate/route.js
          git commit -m "Harden intraday engine precision and enforce 30m horizon [intraday-v1.11-patched]"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/intraday-v1-11-hardening.yml
          git commit -m "Remove temporary intraday hardening workflow"
          git push
